[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

[coverage:run]
source = backend
omit =
    */tests/*
    */__pycache__/*
    */migrations/*
    */seed.py
    */orchestrator.py
    */dispatcher.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False